        <p class="MsoNormal"><span style="font-size: 12.0pt">All I could hear 
        behind the record playing <br>
        was the loud whistle of the train.<br>
        And behind the tall, uniformly created <br>
        brick buildings were neighborhoods<br>
        of impoverished outcasts.<br>
        Still.</span></p>
