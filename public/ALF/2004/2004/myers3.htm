        <p class="MsoNormal" style="text-autospace: none"><b><font size="4">The 
        Definition of Semiology</font></b>&nbsp;</p>
        <p class="MsoNormal" style="text-autospace: none"><i>Means</i> and <i>is</i> 
        and all that other nonsense,<br>
        as if the language of the new calf <br>
        rising from summer plum darkness of pasture,<br>
        so small, so like dandelion fuzz on warm wind,<br>
        was anything other than the sound<br>
        she makes for her mother.&nbsp;</p>
